# Builds the API reference from PHPDoc blocks and publishes it to GitHub
# Pages. Separate from ci.yml's own jobs since this deploys something
# (a live site), not just checks a diff.
#
# Runs phpDocumentor from a pinned phar (scripts/phpdoc.sh) rather than as
# a composer dependency: this repo's own transitive deps (paratest/
# nunomaduro via pestphp) already lock symfony/console to ^7/^8, and
# phpDocumentor 3.10.0 -- its latest release -- caps at ^6.0, so
# `composer require` can never resolve it.
#
# Also runs on pull_request (build only, deploy stays push-to-main-only)
# so a change that breaks phpdoc itself fails PR checks instead of only
# main's push-triggered run.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per ref, not one shared group: a single `pages` group let a queued PR run
# displace main's deploy run (the pending slot holds one run, and the
# newest wins), so main pushes were being cancelled instead of deployed.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer:2.9.5
          extensions: iconv
          coverage: pcov
      # The reports ship from this job, not ci.yml's: a repo has one Pages
      # deployment, so one job has to assemble the whole site. A red test
      # run fails the job here, so nothing is deployed.
      - run: composer install --no-interaction --prefer-dist
      - name: Pest
        run: >-
          vendor/bin/pest --log-junit junit.xml
          --coverage-clover coverage.xml
          --coverage-cobertura cobertura.xml
          --coverage-html coverage-html
      - run: bash scripts/phpdoc.sh
      # phpDocumentor 3's config format (configVersion="3") has no
      # documented way to copy an arbitrary project file into the built
      # `site/` output -- the old <transformation>/FileIo "copy" writer was
      # a phpDocumentor 2-era template.xml concept, not something the v3
      # project config exposes, and the output tree here is fully
      # regenerated by the template on every run rather than mirroring
      # anything from the repo root. A plain copy step is the reliable
      # option.
      - run: cp llms.txt site/llms.txt
      - run: bash scripts/assemble-reports.sh
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Live coverage.xml is served and is Cobertura
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --output coverage.xml "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
