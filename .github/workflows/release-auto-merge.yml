name: Auto-merge release PR

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    # Quoted: the colon inside 'autorelease: pending' makes this an
    # invalid plain YAML scalar in block context otherwise (YAML parses
    # the file before GitHub Actions ever evaluates the expression) --
    # confirmed live, this exact unquoted form silently broke every push
    # to this repo with "workflow file issue" and zero jobs ever running.
    if: "contains(github.event.pull_request.labels.*.name, 'autorelease: pending')"
    runs-on: ubuntu-latest
    steps:
      - name: Merge the release PR
        run: |
          # Arming auto-merge is refused while GitHub calls the pull request
          # unstable (a non-required check still running) or clean (nothing left to
          # wait for). Merge directly then, but only once the required checks pass:
          # enforce_admins is off on main, so GitHub would not stop this token.
          set -euo pipefail
          if out=$(gh pr merge --auto --squash "$PR_URL" 2>&1); then echo "$out"; exit 0; fi
          echo "$out" >&2
          case "$out" in
            *"is in unstable status"* | *"is in clean status"*)
              gh pr checks "$PR_URL" --required
              gh pr merge --squash "$PR_URL"
              ;;
            *) exit 1 ;;
          esac
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
