name: Auto-merge Dependabot PR

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type) }}
        run: |
          # Arming auto-merge is refused while GitHub calls the pull request
          # unstable (a non-required check still running) or clean (nothing left to
          # wait for). Merge directly then, but only once the required checks pass:
          # enforce_admins is off on main, so GitHub would not stop this token.
          set -euo pipefail
          if out=$(gh pr merge --auto --squash "$PR_URL" 2>&1); then echo "$out"; exit 0; fi
          echo "$out" >&2
          case "$out" in
            *"is in unstable status"* | *"is in clean status"*)
              gh pr checks "$PR_URL" --required
              gh pr merge --squash "$PR_URL"
              ;;
            *) exit 1 ;;
          esac
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
